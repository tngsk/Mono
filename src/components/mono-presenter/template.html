<template id="mono-presenter-template">
  <style>
    {COMPONENTS_CSS}
  </style>
  <button id="presenter-btn" class="presenter-toggle" aria-label="プレゼンタービューを開く (Pキー)" title="プレゼンタービューを開く (P)">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
      <line x1="8" y1="21" x2="16" y2="21"></line>
      <line x1="12" y1="17" x2="12" y2="21"></line>
    </svg>
    <span class="btn-label">Presenter (P)</span>
  </button>
  <aside id="presenter-panel" class="presenter-panel" aria-label="トークスクリプトパネル">
    <div class="panel-header">
      <div id="slide-indicator" class="slide-indicator">スライド 1 / 1</div>
    </div>
    <div class="panel-body">
      <div id="script-content" class="script-content"></div>
    </div>
  </aside>
</template>
