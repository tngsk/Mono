<template id="mono-synth-template">
  <style>{COMPONENTS_CSS}</style>
  <div class="synth-container">
    <div class="scope-container">
      <canvas class="synth-scope" width="800" height="150"></canvas>
    </div>

    <div class="controls-container">
      <!-- Oscillator -->
      <div class="control-group">
        <div class="group-label">OSC</div>
        <div class="knob-container">
          <div class="knob" data-param="oscType" data-type="enum" data-options="sine,square,sawtooth,triangle,sample">
            <div class="knob-dial"><div class="knob-indicator"></div></div>
          </div>
          <div class="knob-label">Type</div>
          <div class="knob-value">Sine</div>
        </div>
      </div>

      <!-- Filter -->
      <div class="control-group">
        <div class="group-label">FILTER</div>
        <div class="knob-container">
          <div class="knob" data-param="filterFreq" data-min="20" data-max="10000" data-value="2000" data-scale="log">
            <div class="knob-dial"><div class="knob-indicator"></div></div>
          </div>
          <div class="knob-label">Cutoff</div>
          <div class="knob-value">2k Hz</div>
        </div>
        <div class="knob-container">
          <div class="knob" data-param="filterRes" data-min="0" data-max="20" data-value="1">
            <div class="knob-dial"><div class="knob-indicator"></div></div>
          </div>
          <div class="knob-label">Res</div>
          <div class="knob-value">1</div>
        </div>
      </div>

      <!-- ADSR -->
      <div class="control-group">
        <div class="group-label">ENVELOPE</div>
        <div class="knob-container">
          <div class="knob" data-param="envA" data-min="0.01" data-max="2" data-value="0.1">
            <div class="knob-dial"><div class="knob-indicator"></div></div>
          </div>
          <div class="knob-label">A</div>
          <div class="knob-value">0.1s</div>
        </div>
        <div class="knob-container">
          <div class="knob" data-param="envD" data-min="0" data-max="2" data-value="0.2">
            <div class="knob-dial"><div class="knob-indicator"></div></div>
          </div>
          <div class="knob-label">D</div>
          <div class="knob-value">0.2s</div>
        </div>
        <div class="knob-container">
          <div class="knob" data-param="envS" data-min="0" data-max="1" data-value="0.5">
            <div class="knob-dial"><div class="knob-indicator"></div></div>
          </div>
          <div class="knob-label">S</div>
          <div class="knob-value">0.5</div>
        </div>
        <div class="knob-container">
          <div class="knob" data-param="envR" data-min="0.01" data-max="5" data-value="1">
            <div class="knob-dial"><div class="knob-indicator"></div></div>
          </div>
          <div class="knob-label">R</div>
          <div class="knob-value">1s</div>
        </div>
      </div>

      <!-- Master -->
      <div class="control-group">
        <div class="group-label">MASTER</div>
        <div class="knob-container">
          <div class="knob" data-param="volume" data-min="-60" data-max="0" data-value="-12">
            <div class="knob-dial"><div class="knob-indicator"></div></div>
          </div>
          <div class="knob-label">Vol</div>
          <div class="knob-value">-12dB</div>
        </div>
      </div>
    </div>

    <!-- 2 Octave Keyboard -->
    <div class="keyboard-container">
      <div class="keyboard-inner">
        <!-- Keys will be generated by JS to keep HTML compact, or hardcoded if preferred -->
        <!-- We will generate them in JS based on C3 to C5 -->
      </div>
    </div>

    <div class="overlay-start">
      <button class="start-btn">Start Synth</button>
    </div>
  </div>
</template>
