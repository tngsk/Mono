</template>
<script>
class MonoBaseElement extends HTMLElement {
    constructor(options = { shadowMode: 'open' }) {
        super();
        this.refs = {};
        this._isMounted = false; // 二重マウント防止用フラグ

        if (options && options.shadowMode) {
            this.attachShadow({ mode: options.shadowMode });
        }
    }

    /**
     * テンプレートをマウントし、data-ref要素をキャッシュする。
     * @param {string} templateId
     */
    mountTemplate(templateId) {
        if (this._isMounted) return;

        const template = document.getElementById(templateId);
        if (!template) {
            console.error(`[Mono] Template #${templateId} not found.`);
            return;
        }

        const root = this.shadowRoot || this;
        root.appendChild(template.content.cloneNode(true));

        // data-refのキャッシュ（セキュリティのためtextContent等の操作を想定）
        root.querySelectorAll("[data-ref]").forEach((el) => {
            this.refs[el.dataset.ref] = el;
        });

        this._isMounted = true;
    }

    /**
     * Get the Mono version from the meta tag.
     * @returns {string} The version string, or "unknown" if not found.
     */
    getMonoVersion() {
        const meta = document.querySelector('meta[name="mono-version"]');
        return meta ? meta.dataset.monoVersion || "unknown" : "unknown";
    }

    /**
     * Save data to localStorage with a version wrapper.
     * @param {string} key
     * @param {any} data
     * @throws {Error} if localStorage is not available or quota is exceeded
     */
    saveState(key, data) {
        try {
            const payload = {
                _version: this.getMonoVersion(),
                data: data
            };
            localStorage.setItem(key, JSON.stringify(payload));
        } catch (e) {
            console.warn(`Failed to save state to localStorage for key: ${key}`, e);
            throw e;
        }
    }

    /**
     * Load data from localStorage and unwrap the version wrapper.
     * Checks if the data has a _version field. If not, assumes it's legacy data.
     * @param {string} key
     * @returns {any|null} The original data, or null if not found.
     * @throws {Error} if localStorage is not available
     */
    loadState(key) {
        try {
            const raw = localStorage.getItem(key);
            if (!raw) return null;

            // mono-notebook, mono-textfield-input のテスト用キーなど、JSONでない場合への対応
            let parsed;
            try {
                parsed = JSON.parse(raw);
            } catch (e) {
                return raw;
            }

            // Wrapper check
            if (parsed && typeof parsed === 'object' && '_version' in parsed && 'data' in parsed) {
                const currentVersion = this.getMonoVersion();
                if (parsed._version !== currentVersion) {
                    // Future implementation: Version migration logic here
                    console.info(`[Mono] Version mismatch for ${key}: Data version ${parsed._version}, Current version ${currentVersion}. Proceeding to load.`);
                }
                return parsed.data;
            }

            // Legacy data (unwrapped)
            return parsed;
        } catch (e) {
            console.warn(`Failed to read state from localStorage for key: ${key}`, e);
            throw e;
        }
    }

    /**
     * Remove data from localStorage.
     * @param {string} key
     * @throws {Error} if localStorage is not available
     */
    removeState(key) {
        try {
            localStorage.removeItem(key);
        } catch (e) {
            console.warn(`Failed to remove state from localStorage for key: ${key}`, e);
            throw e;
        }
    }
}


class MonoInteractiveElement extends MonoBaseElement {
    constructor(options = { shadowMode: 'open' }) {
        super(options);
        this._authChangeListener = this._handleAuthChange.bind(this);
    }

    connectedCallback() {
        // 1. Initial State Check (Race Condition Mitigation)
        try {
            const savedAuth = this.loadState("mono_auth");
            if (savedAuth && savedAuth.user) {
                this._triggerAuthStateChanged(savedAuth.user);
            } else {
                this._triggerAuthStateChanged(null);
            }
        } catch (e) {
            console.warn("Failed to read auth state during initialization:", e);
            this._triggerAuthStateChanged(null); // Fallback to guest
        }

        // 2. Listen for global auth events broadcasted by mono-account
        window.addEventListener("mono-auth-changed", this._authChangeListener);
    }

    disconnectedCallback() {
        window.removeEventListener("mono-auth-changed", this._authChangeListener);
    }

    _handleAuthChange(event) {
        if (event && event.detail !== undefined) {
            this._triggerAuthStateChanged(event.detail.user || null);
        } else {
            this._triggerAuthStateChanged(null);
        }
    }

    _triggerAuthStateChanged(user) {
        if (typeof this.onAuthStateChanged === "function") {
            try {
                this.onAuthStateChanged(user);
            } catch (e) {
                console.error("Error in onAuthStateChanged hook:", e);
            }
        }
    }

    // Child classes can override this method to handle auth state changes.
    onAuthStateChanged(user) {
        // Default behavior is to do nothing, wait for child implementation.
    }
}


class MonoBadge extends MonoBaseElement {
    constructor() {
        super();

        this.mountTemplate('mono-badge-template');
    }

    connectedCallback() {
        this.render();
    }

    static get observedAttributes() {
        return ['color', 'soft', 'outline'];
    }

    attributeChangedCallback() {
        this.render();
    }

    render() {
        // apply classes based on attributes to the wrapper inside the template
        const wrapper = this.shadowRoot.querySelector('.mono-badge');
        if (!wrapper) return;

        // Reset classes
        wrapper.className = 'mono-badge';

        const color = this.getAttribute('color');
        if (color) {
            wrapper.classList.add(`mono-badge-${color}`);
        }

        if (this.hasAttribute('soft')) {
            wrapper.classList.add('mono-badge-soft');
        }

        if (this.hasAttribute('outline')) {
            wrapper.classList.add('mono-badge-outline');
        }
    }
}

customElements.define('mono-badge', MonoBadge);


class MonoBrush extends MonoBaseElement {
  constructor() {
    super();
    this.isDrawingModeActive = false;
    this.isDrawing = false;
    this.hue = 0;
    this.lastX = 0;
    this.lastY = 0;
    this.animationFrameId = null;
    this.resizeTimeout = null;
  }

  connectedCallback() {
    super.mountTemplate("mono-brush-template");
    this.setupElements();
    this.setupEventListeners();
    this.resizeCanvas();
  }

  disconnectedCallback() {
    this.removeEventListeners();
  }

  setupElements() {
    this.pointer = this.shadowRoot.getElementById("pointer");
    this.canvas = this.shadowRoot.getElementById("canvas");
    this.ctx = this.canvas.getContext("2d");
  }

  setupEventListeners() {
    this.handleKeyDown = this.handleKeyDown.bind(this);
    this.handleKeyUp = this.handleKeyUp.bind(this);
    this.handleMouseMove = this.handleMouseMove.bind(this);
    this.handleMouseDown = this.handleMouseDown.bind(this);
    this.handleMouseUp = this.handleMouseUp.bind(this);
    this.handleResize = this.handleResize.bind(this);

    this.handleBlur = this.handleBlur.bind(this);

    document.addEventListener("keydown", this.handleKeyDown);
    document.addEventListener("keyup", this.handleKeyUp);
    document.addEventListener("mousemove", this.handleMouseMove, {
      passive: false,
    });

    // Canvas events for drawing
    this.canvas.addEventListener("mousedown", this.handleMouseDown);
    this.canvas.addEventListener("mousemove", this.handleMouseMove);
    this.canvas.addEventListener("mouseup", this.handleMouseUp);
    this.canvas.addEventListener("mouseout", this.handleMouseUp);

    // Touch support
    this.canvas.addEventListener(
      "touchstart",
      this.handleTouchStart.bind(this),
      { passive: false },
    );
    this.canvas.addEventListener("touchmove", this.handleTouchMove.bind(this), {
      passive: false,
    });
    this.canvas.addEventListener("touchend", this.handleMouseUp);

    window.addEventListener("resize", this.handleResize);
    window.addEventListener("blur", this.handleBlur);
  }

  removeEventListeners() {
    document.removeEventListener("keydown", this.handleKeyDown);
    document.removeEventListener("keyup", this.handleKeyUp);
    document.removeEventListener("mousemove", this.handleMouseMove);
    window.removeEventListener("resize", this.handleResize);
    window.removeEventListener("blur", this.handleBlur);
  }

  handleBlur() {
    this.isDrawingModeActive = false;
    this.updateMode();
  }

  handleResize() {
    // Debounce resize
    clearTimeout(this.resizeTimeout);
    this.resizeTimeout = setTimeout(() => {
      this.resizeCanvas();
    }, 200);
  }

  resizeCanvas() {
    this.canvas.width = window.innerWidth;
    this.canvas.height = window.innerHeight;
  }

  updateMode() {
    const inDrawingMode = this.isDrawingModeActive;

    // Pointer mode is disabled
    this.pointer.classList.add("hidden");

    if (inDrawingMode) {
      this.canvas.classList.add("drawing-mode");
      this.canvas.classList.remove("hidden");
    } else {
      this.canvas.classList.remove("drawing-mode");
      this.isDrawing = false;

      // Fade out and clear canvas if we were drawing
      if (!this.canvas.classList.contains("hidden")) {
        this.canvas.classList.add("hidden");
        // Wait for fade out animation before clearing
        setTimeout(() => {
          this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        }, 300);
      }
    }
  }

  handleKeyDown(e) {
    if (e.key === "CapsLock" || e.code === "CapsLock") {
      this.isDrawingModeActive = !this.isDrawingModeActive;
      this.updateMode();
    }
  }

  handleKeyUp(e) {
    // No-op for now, as drawing mode is toggled on keydown
  }

  updatePointerPosition(x, y) {
    // Pointer mode is disabled, so we don't need to update pointer position
  }

  getPointerPosition(clientX, clientY) {
    const rect = this.canvas.getBoundingClientRect();
    return {
      x: clientX - rect.left,
      y: clientY - rect.top
    };
  }

  handleMouseMove(e) {
    // Handle drawing
    if (this.isDrawing && this.isDrawingModeActive) {
      e.preventDefault(); // Prevent text selection/scrolling while drawing
      const pos = this.getPointerPosition(e.clientX, e.clientY);
      this.draw(pos.x, pos.y);
    }
  }

  handleMouseDown(e) {
    if (this.isDrawingModeActive) {
      this.isDrawing = true;
      const pos = this.getPointerPosition(e.clientX, e.clientY);
      this.lastX = pos.x;
      this.lastY = pos.y;
      this.draw(pos.x, pos.y); // Draw a dot
    }
  }

  handleMouseUp() {
    this.isDrawing = false;
  }

  handleTouchStart(e) {
    if (this.isDrawingModeActive) {
      e.preventDefault();
      const touch = e.touches[0];
      this.handleMouseDown({ clientX: touch.clientX, clientY: touch.clientY });
    }
  }

  handleTouchMove(e) {
    if (this.isDrawing && this.isDrawingModeActive) {
      e.preventDefault();
      const touch = e.touches[0];
      this.handleMouseMove({
        clientX: touch.clientX,
        clientY: touch.clientY,
        preventDefault: () => {},
      });
    }
  }

  draw(x, y) {
    if (!this.isDrawing) return;

    this.ctx.beginPath();
    this.ctx.moveTo(this.lastX, this.lastY);
    this.ctx.lineTo(x, y);
    this.ctx.strokeStyle = `hsl(${this.hue}, 100%, 60%)`;
    this.ctx.lineWidth = 12;
    this.ctx.lineCap = "round";
    this.ctx.lineJoin = "round";
    this.ctx.stroke();

    this.lastX = x;
    this.lastY = y;
    this.hue = (this.hue + 0.25) % 360; // Slowly cycle hue
  }
}

class MonoSync extends MonoBaseElement {
    constructor() {
        super();
    }

    connectedCallback() {
        super.mountTemplate('mono-sync-template');
        this.setupDataRecovery();
        this.setupFocusSync();
    }

    getEnvironmentContext() {
        return {
            userAgent: navigator.userAgent,
            windowWidth: window.innerWidth,
            windowHeight: window.innerHeight,
            url: window.location.href,
        };
    }

    setupDataRecovery() {
        // Listen for mono:vote and mono-data events bubbling up to document
        const handleDataEvent = (e) => {
            const data = {
                ...e.detail,
                environment: this.getEnvironmentContext(),
            };
            this.sendDataToServer(data);
        };
        document.addEventListener("mono:vote", handleDataEvent);
        document.addEventListener("mono-data", handleDataEvent);
    }

    async sendDataToServer(data) {
        const apiMeta = document.querySelector('meta[name="mono-api-url"]');
        const apiUrl = apiMeta ? apiMeta.content : null;
        if (!apiUrl) {
            console.info("💡 [Mono] スタンドアロンモードで動作しています。データはローカルにのみ保存されます。");
            return;
        }

        try {
            const response = await fetch(apiUrl + "/api/data", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });
            if (!response.ok) {
                throw new Error("Server responded with an error");
            }
        } catch (error) {
            console.info("💡 [Mono] サーバに接続できません（オフライン）。入力内容はブラウザに保存されているため、右下のボタンからJSONでダウンロードできます。");
        }
    }

    setupFocusSync() {
        const apiMeta = document.querySelector('meta[name="mono-api-url"]');
        const apiUrl = apiMeta ? apiMeta.content : null;
        if (!apiUrl) return;

        const urlParams = new URLSearchParams(window.location.search);
        const isHost = urlParams.get("role") === "host";

        try {
            if (isHost) {
                console.log("🟢 [Mono] リアルタイム同期を有効化しました（Role: Host）");
                this.setupHostObserver(apiUrl);
            } else {
                this.setupParticipantListener(apiUrl);
            }
        } catch (e) {
             console.info("💡 [Mono] 同期機能を初期化できませんでした。スタンドアロンで実行します。");
        }
    }

    setupHostObserver(apiUrl) {
        let lastTargetId = null;

        const observer = new IntersectionObserver((entries) => {
            // Find the most visible heading
            for (const entry of entries) {
                if (entry.isIntersecting && entry.target.id) {
                    if (lastTargetId !== entry.target.id) {
                        lastTargetId = entry.target.id;
                        this.broadcastFocus(apiUrl, lastTargetId);
                    }
                    break;
                }
            }
        }, { threshold: 0.5 });

        // Observe h1, h2, h3 tags
        document.querySelectorAll("h1, h2, h3").forEach(el => {
            if (el.id) observer.observe(el);
        });
    }

    broadcastFocus(apiUrl, targetId) {
        fetch(apiUrl + "/api/sync", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ type: "focus", targetId })
        }).catch(err => {
            console.error("Focus broadcast error:", err);
        });
    }

    setupParticipantListener(apiUrl) {
        this.eventSource = new EventSource(apiUrl + "/api/sync/stream");

        this.eventSource.onopen = () => {
            console.log("🟢 [Mono] リアルタイム同期に接続しました（Role: Participant）");
        };

        this.eventSource.onerror = () => {
            console.info("💡 [Mono] 同期サーバとの接続が切断されました。");
        };

        this.eventSource.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                if (data.type === "focus" && data.targetId) {
                    const el = document.getElementById(data.targetId);
                    if (el) {
                        el.scrollIntoView({ behavior: "smooth" });
                    }
                }
            } catch (e) {
                console.error("Focus Sync error:", e);
            }
        };
    }
}
